<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8a5cf5">
  <meta name="description" content="Spoki — bezpieczny, mówiący asystent dla najmłodszych.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Spoki — Twój mały asystent</title>
  <style>
    :root{--purple:#7042c1;--ink:#402663;--card:rgba(255,255,255,.94);--shadow:rgba(63,34,96,.14)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{min-height:100svh;display:flex;justify-content:center;background:radial-gradient(circle at 15% 10%,#fff8 0 8%,transparent 9%),linear-gradient(155deg,#a8e6ff,#ffd6e8 56%,#fff3b0);font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink);padding:max(14px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));overflow-x:hidden}
    button{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:min(100%,620px);display:flex;flex-direction:column;align-items:center}
    h1{margin:4px 0 10px;color:var(--purple);text-shadow:0 2px #fff;font-size:clamp(23px,6vw,35px);text-align:center}
    .langs{display:flex;gap:8px;margin-bottom:9px}.lang{font-size:28px;line-height:1;background:#fff;border:3px solid transparent;border-radius:16px;padding:7px 10px;cursor:pointer;box-shadow:0 4px var(--shadow);transition:.18s}.lang[aria-pressed="true"]{border-color:var(--purple);transform:translateY(-2px) scale(1.07)}
    .avatar{position:relative;width:166px;height:174px;margin:5px 0 0}.blob{position:absolute;inset:8px 0 0;background:linear-gradient(145deg,#c295f2,#8555ed);border-radius:49% 49% 46% 46%;box-shadow:inset -11px -14px #0001,0 10px #00000014;animation:bob 3s ease-in-out infinite}.antenna{position:absolute;z-index:2;top:-14px;left:calc(50% - 3px);width:6px;height:30px;background:#8555ed;border-radius:5px}.antenna:after{content:"";position:absolute;top:-11px;left:-6px;width:18px;height:18px;background:#ffd93b;border-radius:50%;box-shadow:0 0 15px #ffd93b}.eye{position:absolute;z-index:2;top:62px;width:34px;height:39px;background:#fff;border-radius:50%;animation:blink 4.5s infinite}.eye:after{content:"";position:absolute;left:8px;bottom:6px;width:18px;height:18px;background:#352249;border-radius:50%}.eye.l{left:36px}.eye.r{right:36px}.cheek{position:absolute;z-index:2;top:109px;width:23px;height:12px;background:#ffacd0;border-radius:50%}.cheek.l{left:22px}.cheek.r{right:22px}.mouth{position:absolute;z-index:2;top:116px;left:61px;width:44px;height:18px;background:#55307f;border-radius:0 0 44px 44px}.mic{position:absolute;z-index:3;right:-5px;bottom:0;font-size:30px;opacity:0}.avatar.talking .mouth{animation:talk .18s infinite alternate}.avatar.listening .mic{opacity:1;animation:pulse 1.1s infinite}.avatar.listening .blob{animation-duration:1.4s}
    .bubble{width:100%;min-height:64px;margin:10px 0 5px;padding:14px 20px;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:24px;box-shadow:0 6px var(--shadow);font-weight:800;font-size:clamp(18px,4.6vw,24px);text-align:center;line-height:1.25}.heard{min-height:25px;margin:3px 0 7px;color:#76569e;font-size:14px;font-style:italic;text-align:center}
    .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:4px 0 17px}.chip{color:#50308f;background:#fff;border:3px solid #d8c3ff;border-radius:18px;padding:10px 13px;font-weight:800;cursor:pointer;box-shadow:0 4px #d8c3ff;transition:.12s}.chip:active{transform:translateY(3px);box-shadow:0 1px #d8c3ff}
    .start{border:0;border-radius:60px;padding:15px 30px;color:#fff;background:linear-gradient(145deg,#ff8fb8,#f5528d);box-shadow:0 6px #ca3f71;font-size:clamp(19px,5vw,26px);font-weight:900;cursor:pointer}.start:active{transform:translateY(4px);box-shadow:0 2px #ca3f71}.start.stop{background:linear-gradient(145deg,#ffb15f,#ff8138);box-shadow:0 6px #cc6725}.note{margin-top:14px;color:#795e9d;font-size:12px;line-height:1.35;text-align:center}.toast{position:fixed;z-index:10;left:50%;bottom:max(14px,env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 24px);padding:11px 17px;transform:translate(-50%,20px);opacity:0;background:#402663;color:#fff;border-radius:14px;text-align:center;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes bob{50%{transform:translateY(-8px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}@keyframes talk{to{height:32px;border-radius:20px}}@keyframes pulse{50%{transform:scale(1.25)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app">
  <h1 id="title">🌟 Spoki — Twój mały asystent 🌟</h1>
  <nav class="langs" aria-label="Wybierz język">
    <button class="lang" data-lang="pl" aria-label="Polski" aria-pressed="true">🇵🇱</button><button class="lang" data-lang="en" aria-label="English" aria-pressed="false">🇬🇧</button><button class="lang" data-lang="nl" aria-label="Nederlands" aria-pressed="false">🇳🇱</button><button class="lang" data-lang="sw" aria-label="Kiswahili" aria-pressed="false">🇰🇪</button>
  </nav>
  <div class="avatar" id="avatar" aria-hidden="true"><div class="antenna"></div><div class="blob"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="mic">🎤</div></div>
  <div class="bubble" id="bubble" role="status" aria-live="polite">Cześć! Naciśnij START, a będziemy rozmawiać 💜</div>
  <div class="heard" id="heard" aria-live="polite"></div><div class="chips" id="chips"></div>
  <button class="start" id="startBtn">▶ START ROZMOWY</button>
  <div class="note" id="note">Najlepiej działa w Chrome lub Edge. Rodzicu: kliknij START i pozwól na mikrofon 🎙️</div>
</main><div class="toast" id="toast" role="alert"></div>
<script src="app.js"></script>
</body></html>
